
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空杀124 - Main Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e90ff;
            font-family: 'Microsoft YaHei', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        .btn {
            display: block;
            width: 250px;
            margin: 15px auto;
            padding: 15px 0;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid white;
            border-radius: 8px;
            transition: all 0.3s ease;
            background-color: transparent;
            cursor: pointer;
        }

        .btn:hover {
            background-color: white;
            color: #1e90ff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            背景颜色: #fff;
            颜色: #1e90ff;
        }
        .btn-primary:hover {
            background-color: #f0f0f0;
            color: #0066cc;
        }
        
        .btn-register {
            position: absolute;
            top: 20px;
            right: 20px;
            width: auto;
            padding: 10px 20px;
            font-size: 16px;
            margin: 0;
        }

        .lang-switch {
            position: absolute;
            top: 20px;
            left: 20px;
            width: auto;
            padding: 10px 20px;
            font-size: 16px;
            margin: 0;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-switch:hover {
            background-color: white;
            color: #1e90ff;
        }

        footer {
            background-color: #333333; 
            color: #ffffff; 
            text-align: center; 
            padding: 15px 0; 
            font-size: 14px; 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            font-family: 'Microsoft YaHei', sans-serif;
        }

        @media (max-width: 600px) {
            .btn-register, .lang-switch {
                position: relative;
                top: 0;
                right: 0;
                left: 0;
                margin: 0 auto 20px auto;
                width: 150px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <button class="lang-switch" id="langBtn">English</button>
        <a href="https://tks124.github.io/zc/" class="btn btn-register" data-lang="register">注册</a>

        <h1 data-lang="title">Space Kill124</h1>
        
        <a href="https://tks124.github.io/124/" class="btn btn-primary" data-lang="mod-site">改版官网</a>
        
        <a href="https://app-d8gm4nxuj1fl.appmiaoda.com/" class="btn btn-primary" data-lang="landlord">斗地主</a>
        
        <a href="https://m.bilibili.com/space/482735934?plat_id=1&share_from=space&share_medium=android&share_plat=android&share_session_id=a0b32709-0716-446b-941f-539de858dc73&share_source=COPY&share_tag=s_i&timestamp=1784629471&unique_k=A4FGJGl" class="btn" data-lang="admin-profile">管理员个人主页</a>
        
        <a href="https://tks124.github.io/tks123/" class="btn" data-lang="changelog">更新日志</a>

        <a href="https://tks124.github.io/pvz2/" class="btn" data-lang="pvz-creator">PVZ高级创作</a>

        <a href="https://tks124.github.io/tks124/" class="btn" data-lang="password-test">密码强度测试</a>

        <a href="https://tks124.github.io/2wm/" class="btn" data-lang="qrcode-gen">二维码生成</a>

        <a href="https://tks124.github.io/tp/" class="btn" data-lang="img-convert">图片格式转换</a>

        <a href="https://tks124.github.io/tupian/" class="btn" data-lang="img-convert">音乐嵌入图片</a>
        
        <a href="mailto:tks124@foxmail.com" class="btn" data-lang="feedback">意见反馈</a>
    </div>
    
    <footer data-lang="footer">
        © 太空杀124拥有最终解释权与所有权。
    </footer>

    <script>
        const AUTH_KEY = "sk124_auth_token";
        const AUTH_PAGE_URL = "https://tks124.github.io/tks/";
        const LANG_KEY = "sk124_lang";

        const WHITELIST_DOMAINS = [
            'bilibili.com',
            'foxmail.com'
        ];

        const translations = {
            zh: {
                register: "注册",
                title: "Space Kill124",
                modSite: "改版官网",
                landlord: "斗地主",
                adminProfile: "管理员个人主页",
                changelog: "更新日志",
                pvzCreator: "PVZ高级创作",
                passwordTest: "密码强度测试",
                qrcodeGen: "二维码生成",
                imgConvert: "图片格式转换",
                feedback: "意见反馈",
                footer: "© 太空杀124拥有最终解释权与所有权。",
                safetyAlert: "当前前往的网站并非Space Kill 124名下，注意隐私安全。"
            },
            en: {
                register: "Register",
                title: "Space Kill124",
                modSite: "Modded Site",
                landlord: "Landlord Game",
                adminProfile: "Admin Profile",
                changelog: "Changelog",
                pvzCreator: "PVZ Creator",
                passwordTest: "Password Test",
                qrcodeGen: "QR Code Gen",
                imgConvert: "Image Convert",
                feedback: "Feedback",
                footer: "© Space Kill124 reserves all rights.",
                safetyAlert: "The site you are visiting is not owned by Space Kill 124. Proceed with caution."
            }
        };

        let currentLang = localStorage.getItem(LANG_KEY) || 'zh';

        function updateText() {
            const t = translations[currentLang];
            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.getAttribute('data-lang');
                if (t[key]) {
                    if (el.tagName === 'A') {
                        el.textContent = t[key];
                    } else {
                        el.innerText = t[key];
                    }
                }
            });
            document.getElementById('langBtn').textContent = currentLang === 'zh' ? 'English' : '中文';
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem(LANG_KEY, currentLang);
            updateText();
        }

        function isWhitelisted(url) {
            if (url.startsWith('mailto:')) {
                return true;
            }
            try {
                const urlObj = new URL(url);
                return WHITELIST_DOMAINS.some(domain => urlObj.hostname.includes(domain));
            } catch (e) {
                return false;
            }
        }

        function navigateWithSafetyCheck(url) {
            if (!url || url === '#') {
                return;
            }

            if (isWhitelisted(url)) {
                window.location.href = url;
                return;
            }

            if (url.startsWith("https://tks124.github.io/")) {
                window.location.replace(url);
                return;
            }

            const isConfirmed = confirm(translations[currentLang].safetyAlert);
            if (isConfirmed) {
                window.location.href = url;
            }
        }

        document.getElementById('langBtn').addEventListener('click', toggleLanguage);
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const targetUrl = this.getAttribute('href');
                navigateWithSafetyCheck(targetUrl);
            });
        });

        window.onload = function() {
            updateText();
            if (localStorage.getItem(AUTH_KEY) !== "true") {
                window.location.replace(AUTH_PAGE_URL);
            }
        };
    </script>

</body>
</html>
