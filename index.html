        body {

            display: flex;
            justify-content: center;

        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);

            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);

        h1 {

        .btn {
            display: block;
            width: 250px;
            margin: 15px auto;
            padding: 15px 0;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid white;
            border-radius: 8px;
            transition: all 0.3s ease;
            background-color: transparent;
            cursor: pointer;
        }

        .btn:hover {
            background-color: white;
            color: #1e90ff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background-color: #fff;
            color: #1e90ff;
        }
        .btn-primary:hover {
            background-color: #f0f0f0;
            color: #0066cc;
        }
        
        .btn-register {
            position: absolute;
            top: 20px;
            right: 20px;
            width: auto;
            padding: 10px 20px;
            font-size: 16px;
            margin: 0;
        }

        footer {
            background-color: #333333; 
            color: #ffffff; 
            text-align: center; 
            padding: 15px 0; 
            font-size: 14px; 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            font-family: 'Microsoft YaHei', sans-serif;
        }

        @media (max-width: 600px) {
            .btn-register {
                position: relative;
                top: 0;
                right: 0;
                margin: 0 auto 20px auto;
                width: 150px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="https://tks124.github.io/zc/" class="btn btn-register">注册</a>

    </div>
    
    <footer>
        © 太空杀124拥有最终解释权与所有权。
    </footer>

    <script>
        const AUTH_KEY = "sk124_auth_token";
        const AUTH_PAGE_URL = "https://tks124.github.io/tks/";
        
        const WHITELIST_DOMAINS = [
            'bilibili.com',
            'foxmail.com'
        ];


        function isWhitelisted(url) {
            if (url.startsWith('mailto:')) {
                return true;
            }
            try {
                const urlObj = new URL(url);
                return WHITELIST_DOMAINS.some(domain => urlObj.hostname.includes(domain));
            } catch (e) {
                return false;
            }
        }

        function navigateWithSafetyCheck(url) {
            if (!url || url === '#') {
                return;
            }

            if (isWhitelisted(url)) {
                window.location.href = url;
                return;
            }

            if (url.startsWith("https://tks124.github.io/")) {
                window.location.replace(url);
                return;
            }

            const isConfirmed = confirm("当前前往的网站并非Space Kill 124名下，注意隐私安全。");
            if (isConfirmed) {
                window.location.href = url;
            }
        }

        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const targetUrl = this.getAttribute('href');
                navigateWithSafetyCheck(targetUrl);
            });
        });

        window.onload = function() {
            if (localStorage.getItem(AUTH_KEY) !== "true") {
                window.location.replace(AUTH_PAGE_URL);
            }
        };
    </script>

</body>
