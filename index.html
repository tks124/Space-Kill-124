        /* 按钮容器 */

        .btn {

            margin: 15px auto;
            padding: 15px 0;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid white;
            border-radius: 8px;
            transition: all 0.3s ease;
            background-color: transparent;
        }

        /* 按钮悬停效果 */
        .btn:hover {
            background-color: white;
            color: #1e90ff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* 特殊按钮颜色（可选） */
        .btn-primary {
            background-color: #fff;
            color: #1e90ff;
        }
        .btn-primary:hover {

    <script>
        // 验证相关的配置
        const AUTH_KEY = "sk124_auth_token"; // 和验证页面保持一致的键名
        const AUTH_PAGE_URL = "https://tks124.github.io/tks/"; // 你的验证页面地址

        // 页面加载时执行检查
        window.onload = function() {
            // 检查本地存储中是否有验证通过的标记
            const isVerified = localStorage.getItem(AUTH_KEY);

            if (isVerified !== "true") {
                // 如果没有验证通过，就强制跳转到验证页面
                // 使用 replace 是为了防止用户点击后退按钮又回到这个页面
                window.location.replace(AUTH_PAGE_URL);

            // 如果验证通过，则什么都不做，正常显示页面内容
        };
